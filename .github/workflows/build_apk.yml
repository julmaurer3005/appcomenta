name: 📱 Build Android APK Automático

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar Capacitor e Gerar Projeto Android
        working-directory: app_android
        run: |
          npm install

          npx cap init InstaSorteio com.instasorteio.bot --web-dir src

          # Remove qualquer pasta android incompleta para gerar do zero com o Gradle Wrapper completo
          rm -rf android

          npx cap add android
          npx cap sync android

      - name: 🛠️ Compilar APK com Gradle
        working-directory: app_android/android
        run: |
          test -f gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🚀 Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: InstaSorteio-Android-APK
          path: app_android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
