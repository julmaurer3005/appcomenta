name: 📱 Build APK Acessibilidade (Oficial Instagram)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: 🛠️ Compilar APK de Acessibilidade com Gradle
        working-directory: app_android_acessibilidade
        run: |
          gradle --version
          gradle assembleDebug --no-daemon

      - name: 🚀 Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: InstaSorteio-Acessibilidade-APK
          path: app_android_acessibilidade/app/build/outputs/apk/debug/*.apk
          retention-days: 30
