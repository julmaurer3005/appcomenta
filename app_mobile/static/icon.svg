<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Robot Head -->
  <rect x="116" y="156" width="280" height="230" rx="48" fill="#0f172a" />
  
  <!-- Antenna -->
  <rect x="244" y="80" width="24" height="76" rx="12" fill="#e2e8f0" />
  <circle cx="256" cy="74" r="28" fill="#38bdf8" />

  <!-- Screen Face -->
  <rect x="146" y="186" width="220" height="170" rx="32" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Eyes -->
  <circle cx="206" cy="256" r="30" fill="url(#eye)" />
  <circle cx="306" cy="256" r="30" fill="url(#eye)" />

  <!-- Smile / Comment Wave -->
  <path d="M 216 316 Q 256 346 296 316" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- Instagram Sparkle -->
  <circle cx="396" cy="120" r="14" fill="#fbbf24" />
</svg>
